[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "faa-notam-plugin"
version = "0.1.0"
description = "Local Codex plugin for FAA NOTAMs over MCP stdio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.11,<3", "mcp>=1.28,<2", "pyproj>=3.7,<4", "shapely>=2.1,<3"]

[project.urls]
Repository = "https://github.com/josvisser66/chatgpt_notam_plugin"
Documentation = "https://github.com/josvisser66/chatgpt_notam_plugin#readme"
Issues = "https://github.com/josvisser66/chatgpt_notam_plugin/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
notam-plugin = "notam_plugin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
