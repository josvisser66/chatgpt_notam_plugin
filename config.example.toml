# Configure one or both environments. FAA KEY = OAuth client ID;
# FAA SECRET = OAuth client secret. Each environment uses its own identity.
# Missing/empty/REPLACE_ credentials leave a profile unconfigured.
# Auto requests prefer production and can fall back to configured staging.
# Ask "Use staging" to select staging explicitly, without fallback.

[faa.production]
key = "REPLACE_WITH_PRODUCTION_FAA_KEY"
secret = "REPLACE_WITH_PRODUCTION_FAA_SECRET"
# Host only, without /nmsapi or /v1.
environment_url = "https://api-nms.aim.faa.gov"
# Optional override if FAA provides a different authorization URL:
# auth_url = "https://api-nms.aim.faa.gov/v1/auth/token"
response_format = "GEOJSON"
timeout_seconds = 12

[faa.staging]
key = "REPLACE_WITH_STAGING_FAA_KEY"
secret = "REPLACE_WITH_STAGING_FAA_SECRET"
environment_url = "https://api-staging.cgifederal-aim.com"
# FIT/SIT hosts may also be configured in this test profile if FAA authorizes them.
# auth_url = "https://api-staging.cgifederal-aim.com/v1/auth/token"
response_format = "GEOJSON"
timeout_seconds = 12

[service]
# Relative paths resolve beside this configuration file, not the working directory.
state_file = "state/rate-limits.sqlite3"
downloads_directory = "state/downloads"
navigation_file = "state/navigation.json"
route_search_directory = "state/route-searches"
route_requests_per_call = 5
max_tool_characters = 90000
max_download_bytes = 500000000

# Default limits follow the FAQ. Production/custom hosts: 180 seconds between
# data calls. Known FAA test hosts: 1 second. Content calls: 0.5 seconds.
# Delta calls: 180 seconds. Bulk calls: 86400 seconds across classifications.
# Overrides apply to BOTH profiles; use only limits FAA has approved for both accounts:
# [limits]
# data_interval_seconds = 180
# content_interval_seconds = 0.5
# delta_interval_seconds = 180
# bulk_interval_seconds = 86400
